<body><main><nav class="site-nav" aria-label="頁面切換"><a href="index.html">24顆結晶最佳化</a><a href="generator.html" aria-current="page">傳說結晶生成</a></nav>
    <section>
      <h1>傳說結晶隨機生成</h1>
      <p>
        可選擇42-60個結晶生成，另有三排詞條可指定生成內容
      </p>
      <div class="buttons" style="align-items: center">
        <label
          >生成數量
          <select id="count"></select></label
        ><button id="generate" class="primary">隨機生成</button
        ><label
          >指定詞條①
          <select id="force0"></select></label
        ><label
          >指定詞條②
          <select id="force1"></select></label
        ><label
          >指定詞條③
          <select id="force2"></select></label
        ><button id="sendSelected" class="primary">儲存勾選並前往最佳化</button><button id="export">匯出全部</button
        ><button id="exportSelected">匯出勾選結晶</button>
      </div>
      <div class="selection-summary" role="status" aria-live="polite"><span id="status"></span><span id="currentCrit"></span></div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>選取</th>
              <th>#</th>
              <th>階級</th>
              <th>第一排</th>
              <th>數值</th>
              <th>第二排</th>
              <th>數值</th>
              <th>原始評分</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </section>
  <footer class="site-footer">版本 V0.53｜更新時間 <time datetime="2026-10-03T17:48+08:00">2026/10/03 17:48</time>（台灣時間）</footer></main>
<script>

const types=[['','未使用',0,0,1],['crit','爆擊機率',14,16,1],['dmg','爆擊傷害',10,14,1],['mastery','熟練度',7,11,1],['hp','最大HP',300,500,1],['hpp','最大HP%',5,8,1],['magic','魔力',200,400,10],['mp','魔攻%',3,5,1],['cd','冷卻時間減免',2,2,1]];
const storageScope='lcd-crystal-v05:'+new URL('.',location.href).pathname;
const transferKey=storageScope+':selected', pendingKey=storageScope+':pending', gearKey=storageScope+':gear';
function rollLine(type){const t=type?types.find(t=>t[0]===type):types[1+Math.floor(Math.random()*(types.length-1))];return {type:t[0],value:t[2]+Math.floor(Math.random()*((t[3]-t[2])/t[4]+1))*t[4]}}
function validateLine(a,legacy=false){
  if(!a||typeof a!=='object')throw Error('結晶詞條格式錯誤');
  const t=types.find(t=>t[0]===a.type);
  if(!t||!Number.isFinite(a.value))throw Error('結晶詞條或數值錯誤');
  let value=a.value;
  if(legacy&&a.type==='cd'&&value===1)value=2;
  if(value<t[2]||value>t[3]||!Number.isInteger((value-t[2])/t[4]))throw Error(t[1]+'數值須為'+(t[2]===t[3]?t[2]:t[2]+'～'+t[3])+(t[4]>1?'，每'+t[4]+'一格':''));
  return {type:a.type,value};
}
function validateCrystals(c,legacy=false){
  if(!Array.isArray(c)||c.length<1||c.length>24)throw Error('請提供1～24顆結晶');
  return c.map((r,i)=>{if(!Array.isArray(r)||r.length!==2)throw Error('第'+(i+1)+'顆結晶必須有兩排詞條');return r.map(a=>validateLine(a,legacy))});
}


    const el = (id) => document.getElementById(id);
    let crystals = [],
      guaranteed = [],
      selected = new Set();
    el("count").innerHTML = Array.from(
      { length: 19 },
      (_, i) => `<option value="${i + 42}">${i + 42}顆</option>`,
    ).join("");
    el("count").value = "48";
    for (let i = 0; i < 3; i++)
      el("force" + i).innerHTML = types
        .map(
          (t) => `<option value="${t[0]}">${t[0] ? t[1] : "不指定"}</option>`,
        )
        .join("");

    const generatorKey=storageScope+':generator';
    const baseCrit=30;
    function updateSummary(message){
      el('status').textContent=message||`持有${crystals.length}顆結晶｜已勾選${selected.size}／24顆。`;
      const crit=[...selected].reduce((sum,i)=>sum+crystals[i].reduce((n,a)=>n+(a.type==='crit'?a.value:0),0),baseCrit);
      el('currentCrit').textContent=`目前爆擊機率 ${crit}%`+(crit>100?'（有效100%）':'');
    }
    function saveGenerator(){
      try{
        localStorage.setItem(generatorKey,JSON.stringify({schema:'lcd-generator-1',count:Number(el('count').value),forces:[0,1,2].map(i=>el('force'+i).value),crystals,guaranteed,selected:[...selected]}));
        return true;
      }catch(e){updateSummary('保存失敗：'+e.message+'。可用「匯出全部」保留結晶。');return false}
    }
    function restoreGenerator(){
      const raw=localStorage.getItem(generatorKey);if(!raw)return false;
      const d=JSON.parse(raw);
      if(d?.schema!=='lcd-generator-1'||!Number.isInteger(d.count)||d.count<42||d.count>60||!Array.isArray(d.crystals)||d.crystals.length<42||d.crystals.length>60||!Array.isArray(d.forces)||d.forces.length!==3||!d.forces.every(v=>types.some(t=>t[0]===v)))throw Error('生成資料格式錯誤');
      const pool=d.crystals.map((c,i)=>{if(!Array.isArray(c)||c.length!==2)throw Error('第'+(i+1)+'顆結晶格式錯誤');return c.map(a=>validateLine(a))});
      const validIndexes=(arr,limit,max)=>Array.isArray(arr)&&arr.length<=limit&&new Set(arr).size===arr.length&&arr.every(i=>Number.isInteger(i)&&i>=0&&i<max);
      if(!validIndexes(d.guaranteed,3,pool.length*2)||!validIndexes(d.selected,24,pool.length))throw Error('勾選或指定詞條資料格式錯誤');
      crystals=pool;guaranteed=d.guaranteed;selected=new Set(d.selected);
      el('count').value=String(d.count);d.forces.forEach((v,i)=>el('force'+i).value=v);
      render();updateSummary();return true;
    }

    function roll(type) { return rollLine(type); }
    function generate() {
      selected.clear();
      crystals = Array.from({ length: Number(el("count").value) }, () => [
        roll(),
        roll(),
      ]);
      guaranteed = [];
      // Each guaranteed line uses a different crystal, with a random line slot.
      const available = Array.from({ length: crystals.length }, (_, i) => i);
      for (let j = 0; j < 3; j++) {
        const t = el("force" + j).value;
        if (!t) continue;
        const crystalIndex = available.splice(Math.floor(Math.random() * available.length), 1)[0];
        const pos = crystalIndex * 2 + Math.floor(Math.random() * 2);
        crystals[Math.floor(pos / 2)][pos % 2] = roll(t);
        guaranteed.push(pos);
      }
      render();
      updateSummary(`已生成${crystals.length}顆結晶，共${crystals.length * 2}排詞條。已勾選0／24顆。`);
      saveGenerator();
    }
    const cdRatios = [
      1, 1.0194, 1.041929179095487, 1.0683, 1.0994, 1.137, 1.1578,
      1.1811, 1.2071, 1.2364,
    ];
    function crystalPower(c) {
      const a = {
        magic: 0,
        mp: 0,
        mastery: 0,
        crit: 0,
        dmg: 0,
        cd: 0,
      };
      c.forEach((line) => {
        if (line.type in a) a[line.type] += Number(line.value) || 0;
      });
      const magic = Math.floor((8070 + a.magic) * (1 + a.mp / 100) + 1e-9);
      const crit = Math.min(100, 30 + a.crit) / 100;
      // Score critical damage by its relative gain at 100% critical rate.
      // Keep the critical-rate line's existing value; actual optimization is unchanged.
      const critDmg = 193 / 100;
      const damageFactor = (193 + a.dmg) / 193;
      const cd = Math.min(9, a.cd);
      const lo = Math.floor(cd),
        hi = Math.ceil(cd);
      const cdFactor =
        cdRatios[lo] + (cdRatios[hi] - cdRatios[lo]) * (cd - lo);
      return (
        magic *
        (45 + a.mastery * 0.075) *
        (1 + crit * (critDmg - 1)) *
        damageFactor *
        cdFactor
      );
    }
    const basePower = crystalPower([]);
    function originalScore(c) {
      return (crystalPower(c) / basePower - 1) * 100 - 5;
    }
    function scoreCell(c) {
      const score = originalScore(c);
      const color = score >= 5 ? "#23805e" : score >= 0 ? "#7952bb" : "#c84f68";
      return `<td style="font-weight:bold;color:${color}">${score >= 0 ? "+" : ""}${score.toFixed(1)}</td>`;
    }
    function render() {
      el("rows").innerHTML = crystals
        .map(
          (c, i) =>
            `<tr><td><input type="checkbox" data-i="${i}" ${selected.has(i)?"checked":""} aria-label="選取結晶${i + 1}" style="width:20px;height:20px"></td><td class="num">#${i + 1}</td><td>傳說</td>${c.map((a, j) => `<td style="${guaranteed.includes(i * 2 + j) ? "background:#eee4fb;color:#7952bb;font-weight:bold" : ""}">${types.find((t) => t[0] === a.type)[1]}</td><td>${a.value}${["crit", "dmg", "mastery", "hpp", "mp"].includes(a.type) ? "%" : a.type === "cd" ? "秒" : ""}</td>`).join("")}${scoreCell(c)}</tr>`,
        )
        .join("");
    }
    el("rows").onchange = (e) => {
      const i = Number(e.target.dataset.i);
      if(!Number.isInteger(i)||i<0||i>=crystals.length)return;
      if (e.target.checked) {
        if (selected.size >= 24) {
          e.target.checked = false;
          updateSummary(`最多勾選24顆。持有${crystals.length}顆結晶｜已勾選${selected.size}／24顆。`);
          return;
        }
        selected.add(i);
      } else selected.delete(i);
      updateSummary();
      saveGenerator();
    };
    function download(c, name) {
      const blob = new Blob(
        [JSON.stringify({ schema: "lcd-crystals-1", crystals: c }, null, 2)],
        { type: "application/json" },
      );
      const u = URL.createObjectURL(blob),
        a = document.createElement("a");
      a.href = u;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }
    el("generate").onclick = generate;
    el("export").onclick = () =>
      download(crystals, "crystals_pool_" + crystals.length + ".json");
    el("exportSelected").onclick = () => {
      if (!selected.size) {
        el("status").textContent = "請先勾選要匯出的結晶，最多24顆。";
        return;
      }
      download(
        [...selected].sort((a, b) => a - b).map((i) => crystals[i]),
        "crystals_selected_" + selected.size + ".json",
      );
    };
    el('sendSelected').onclick=()=>{
      if(!selected.size){el('status').textContent='請先勾選要載入的結晶，最多24顆。';return}
      try{if(!saveGenerator())return;const c=[...selected].sort((a,b)=>a-b).map(i=>crystals[i]);validateCrystals(c);localStorage.setItem(transferKey,JSON.stringify({schema:'lcd-crystals-1',crystals:c}));localStorage.setItem(pendingKey,'1');location.href='index.html'}catch(e){el('status').textContent='儲存失敗：'+e.message+'。可改用「匯出勾選結晶」。'}
    };
    ['count','force0','force1','force2'].forEach(id=>el(id).addEventListener('change',saveGenerator));
    try{if(!restoreGenerator())generate()}catch(e){updateSummary('無法載入保存內容：'+e.message+'。請按「隨機生成」重新建立結晶。')}
  
</script></body></html>
